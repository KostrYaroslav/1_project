<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>ESP32 Dashboard</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <style>
        :root { 
            --p: #1a73e8; --s: #1e8e3e; --w: #f9ab00; --d: #d93025; 
            --bg: #ffffff; --card-bg: #f8f9fa;
        }
        body { margin: 0; font-family: 'Segoe UI', Roboto, sans-serif; background: var(--bg); color: #202124; display: flex; flex-direction: column; align-items: center; }
        
        .chrome-menu-btn { position: fixed; top: 15px; right: 15px; width: 40px; height: 40px; display: flex; align-items: center; justify-content: center; border-radius: 50%; cursor: pointer; z-index: 1001; }
        .dots { width: 4px; height: 4px; background: #5f6368; border-radius: 50%; box-shadow: 0 6px 0 #5f6368, 0 -6px 0 #5f6368; }

        h1 { font-size: 22px; font-weight: 400; margin: 60px 0 20px; }
        .card { background: var(--card-bg); border-radius: 12px; padding: 20px; margin-bottom: 16px; width: 90%; max-width: 400px; border: 1px solid #dadce0; box-sizing: border-box; }
        .status-header { display: block; font-size: 14px; font-weight: 500; color: #5f6368; margin-bottom: 15px; text-transform: uppercase; }

        .info-row { display: flex; justify-content: space-between; align-items: center; padding: 10px 0; border-bottom: 1px dotted #dadce0; }
        .sig-badge { padding: 4px 10px; border-radius: 4px; color: white; font-size: 12px; font-weight: bold; }
        .mem-bar { width: 80px; height: 6px; background: #e8eaed; border-radius: 3px; overflow: hidden; display: inline-block; }
        .mem-fill { height: 100%; background: var(--p); transition: 0.5s; width: 0%; }

        .overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.3); z-index: 998; }
        .modal { display: none; position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); background: white; width: 95%; max-width: 380px; border-radius: 8px; z-index: 999; box-shadow: 0 8px 24px rgba(0,0,0,0.2); flex-direction: column; overflow: hidden; }
        .modal.show, .overlay.show { display: flex; }
        .menu-header { padding: 16px; display: flex; align-items: center; border-bottom: 1px solid #dadce0; font-size: 18px; }
        .back-btn { cursor: pointer; margin-right: 15px; color: #5f6368; }

        .menu-item { padding: 16px 20px; cursor: pointer; border-bottom: 1px solid #f1f3f4; color: black; text-decoration: none; }
        .sub-content, .menu-page { display: none; flex-direction: column; }
        .active { display: flex !important; }

        .edit-box { padding: 15px 20px; }
        input { width: 100%; padding: 10px; margin: 8px 0; border: 1px solid #dadce0; border-radius: 4px; box-sizing: border-box; font-size: 15px; }
        
        button { padding: 10px 24px; border: none; border-radius: 4px; cursor: pointer; font-weight: 500; }
        .btn-p { background: var(--p); color: white; }

        .priority-label { display: flex; align-items: center; gap: 10px; margin: 12px 0; font-size: 14px; cursor: pointer; color: #3c4043; }
        .priority-label input { width: auto; margin: 0; }

        .file-select-label { border: 2px dashed #dadce0; border-radius: 8px; padding: 20px; text-align: center; cursor: pointer; margin-bottom: 15px; display: block; }
        .prog-bg { height: 4px; background: #e8eaed; border-radius: 2px; margin: 10px 0; display: none; }
        .prog-fill { height: 100%; background: var(--d); width: 0%; }
    </style>
</head>
<body>

    <div class="chrome-menu-btn" onclick="openModal()"><div class="dots"></div></div>
    <div class="overlay" id="overlay" onclick="closeModal()"></div>

    <div id="setModal" class="modal">
        <div class="menu-header">
            <span id="backBtn" onclick="goBack()" class="back-btn" style="visibility:hidden;">←</span>
            <span id="menuTitle">Настройки</span>
        </div>

        <div id="root-menu" class="menu-page active">
            <div class="menu-item" onclick="navigate('wifi-menu', 'Связь')">Настройки Wi-Fi ➔</div>
            <div class="menu-item" onclick="navigate('page-service', 'Система')">Сервис и Обновление ➔</div>
            <div style="padding:16px; text-align:right;"><button onclick="closeModal()" style="color:var(--p); background:none;">ЗАКРЫТЬ</button></div>
        </div>

        <div id="wifi-menu" class="menu-page">
            <div class="menu-item" onclick="navigate('sub-mdns', 'Имя устройства')">Имя mDNS</div>
            <div class="menu-item" onclick="navigate('sub-main', 'Основная сеть')">Основной Wi-Fi</div>
            <div class="menu-item" onclick="navigate('sub-res', 'Резервная сеть')">Резервный Wi-Fi</div>
        </div>

        <div id="sub-main" class="sub-content">
            <div class="edit-box">
                <b>SSID (Имя сети):</b><input type="text" id="m_ssid_in">
                <b>ПАРОЛЬ:</b><input type="text" id="m_pass_in">
                <label class="priority-label"><input type="radio" name="act" id="act_main"> Сделать эту сеть основной</label>
                <button class="btn-p" style="width:100%; margin-top:10px" onclick="saveWifi('main')">СОХРАНИТЬ</button>
            </div>
        </div>

        <div id="sub-res" class="sub-content">
            <div class="edit-box">
                <b>SSID (Резерв):</b><input type="text" id="r_ssid_in">
                <b>ПАРОЛЬ:</b><input type="text" id="r_pass_in">
                <label class="priority-label"><input type="radio" name="act" id="act_res"> Использовать как резерв</label>
                <button class="btn-p" style="width:100%; margin-top:10px; background:var(--w)" onclick="saveWifi('res')">СОХРАНИТЬ</button>
            </div>
        </div>

        <div id="sub-mdns" class="sub-content">
            <div class="edit-box">
                <b>ЛОКАЛЬНЫЙ ХОСТ (.local):</b><input type="text" id="host_in">
                <button class="btn-p" style="width:100%" onclick="setHost()">ОБНОВИТЬ</button>
            </div>
        </div>

        <div id="page-service" class="sub-content">
            <div class="edit-box">
                <label for="f" class="file-select-label">
                    <span id="f_name" style="font-size: 13px; color: #5f6368;">📁 Выбрать файл прошивки</span>
                    <input type="file" id="f" accept=".bin" style="display:none" onchange="fileChosen()">
                </label>
                <div id="ota_prog_bar" class="prog-bg"><div id="ota_fill" class="prog-fill"></div></div>
                <div id="ota_msg" style="font-size:12px; text-align:center; margin-bottom:10px;"></div>
                <button id="ota_btn" class="btn-p" style="background:var(--d); width:100%" onclick="u()">ПРОШИТЬ</button>
                <button class="btn-p" style="background:#5f6368; width:100%; margin-top:8px;" onclick="rs()">ПЕРЕЗАГРУЗКА</button>
            </div>
        </div>
    </div>

    <h1>Командный Центр</h1>
    
    <div class="card">
        <span class="status-header">📊 Мониторинг</span>
        <div class="info-row"><span>Сеть</span> <b id="cur_ssid" style="color:var(--p)">--</b></div>
        <div class="info-row"><span>Сигнал</span> <div><span id="sig_b" class="sig-badge">--</span> <small id="sig_t" style="font-weight:bold; margin-left:5px;"></small></div></div>
        <div class="info-row"><span>Память</span> <div><span id="mem">--</span> КБ <div class="mem-bar"><div id="mem_f" class="mem-fill"></div></div></div></div>
        <div class="info-row"><span>Аптайм</span> <span id="up" style="font-family:monospace; font-weight:bold;">00:00:00</span></div>
    </div>

    <div class="card" style="border-top: 4px solid var(--s);">
        <span class="status-header">💡 Управление LED</span>
        <p style="text-align:center; margin-bottom:20px;">Режим: <b id="led_t" style="color:var(--p);">--</b></p>
        <div style="display:flex; justify-content: center;">
            <input type="number" id="led_v" style="width:160px; text-align:center; font-weight:bold; color:var(--p); margin:0;" onkeydown="handleArrows(event)" placeholder="0">
        </div>
    </div>

    <script>
        let navH = ['root-menu'], init = false;

        function openModal() { document.getElementById('setModal').classList.add('show'); document.getElementById('overlay').classList.add('show'); }
        function closeModal() { document.getElementById('setModal').classList.remove('show'); document.getElementById('overlay').classList.remove('show'); }
        function navigate(id, title) { navH.push({id, title}); renderNav(); }
        function goBack() { if(navH.length > 1) { navH.pop(); renderNav(); } }
        
        function renderNav() {
            let cur = navH[navH.length-1];
            document.querySelectorAll('.menu-page, .sub-content').forEach(p => p.classList.remove('active'));
            document.getElementById(cur.id || cur).classList.add('active');
            document.getElementById('menuTitle').innerText = cur.title || 'Настройки';
            document.getElementById('backBtn').style.visibility = navH.length > 1 ? 'visible' : 'hidden';
        }

        function fileChosen() {
            let fi = document.getElementById('f').files;
            if(fi.length > 0) document.getElementById('f_name').innerText = "Файл: " + fi[0].name;
        }

        function getStatus() {
            fetch('/status').then(r => r.json()).then(d => {
                document.getElementById('mem').innerText = d.mem;
                document.getElementById('mem_f').style.width = Math.round((d.mem/520)*100) + "%";
                document.getElementById('up').innerText = new Date(d.up * 1000).toISOString().substr(11, 8);
                document.getElementById('cur_ssid').innerText = d.cur_s;
                document.getElementById('led_t').innerText = d.del < 10 ? "Фонарик" : d.del + " ms";

                // Внутри функции getStatus
                let s = d.sig, b = document.getElementById('sig_b'), t = document.getElementById('sig_t');
                b.innerText = s + " dBm";

                if (s > -60) {
                    b.style.background = "#1e8e3e"; // Зеленый (Google Success)
                    t.innerText = "EXCELLENT"; 
                    t.style.color = "#1e8e3e"; 
                } 
                else if (s > -80) {
                    b.style.background = "#f9ab00"; // Желтый (Google Warning)
                    t.innerText = "FAIR"; 
                    t.style.color = "#f9ab00";
                }
                else {
                    b.style.background = "#d93025"; // Красный (Google Danger)
                    t.innerText = "LOW";
                    t.style.color = "#d93025"; 
                 }
                 
                if(!init) {
                    document.getElementById('m_ssid_in').value = d.s1; document.getElementById('m_pass_in').value = d.p1;
                    document.getElementById('r_ssid_in').value = d.s2; document.getElementById('r_pass_in').value = d.p2;
                    document.getElementById('host_in').value = d.host; document.getElementById('led_v').value = d.del;
                    document.getElementById('act_main').checked = (d.act === 'main');
                    document.getElementById('act_res').checked = (d.act === 'res');
                    init = true;
                }
            }).catch(() => {});
        }
        setInterval(getStatus, 3000); getStatus();

        function handleArrows(e) {
            let i = document.getElementById('led_v');
            if (e.keyCode === 13) { e.preventDefault(); setLed(); i.blur(); }
            if(e.keyCode === 38 || e.keyCode === 40) {
                e.preventDefault();
                let v = parseInt(i.value) || 0;
                i.value = (e.keyCode === 38) ? v+10 : v-10;
                setLed();
            }
        }
        function setLed() { fetch('/set?val=' + document.getElementById('led_v').value); }
        function saveWifi(id) {
            let s = document.getElementById(id==='main'?'m_ssid_in':'r_ssid_in').value;
            let p = document.getElementById(id==='main'?'m_pass_in':'r_pass_in').value;
            let a = document.getElementById(id==='main'?'act_main':'act_res').checked;
            fetch(`/set_wifi?id=${id}&ssid=${s}&pass=${p}&act=${a}`).then(() => alert('Сохранено'));
        }
        function setHost() { fetch('/set_host?val=' + document.getElementById('host_in').value); }
        function rs() { if(confirm('Перезагрузить?')) fetch('/restart'); }
        
        function u() {
            let fi = document.getElementById('f').files; if(fi.length === 0) return alert('Файл?');
            let x = new XMLHttpRequest();
            x.open('POST', '/update', true);
            x.upload.onprogress = (e) => { 
                let p = Math.round((e.loaded/e.total)*100);
                document.getElementById('ota_prog_bar').style.display='block';
                document.getElementById('ota_fill').style.width = p + '%';
                document.getElementById('ota_msg').innerText = 'Загрузка: ' + p + '%';
            };
            x.send(fi[0]);
        }
    </script>
</body>
</html>
